[project]
name = "inngest_langchain"
version = "0.1.0"
authors = [{ name = "Inngest Inc.", email = "hello@inngest.com" }]
description = "Durable LangChain agents for the Inngest SDK"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"

dependencies = [
    "inngest>=0.5.21",
    "langchain>=1.4.0,<2",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.11.0",
]

[tool.uv.sources]
inngest = { workspace = true }

[project.urls]
"Homepage" = "https://github.com/inngest/inngest-py"
"Bug Tracker" = "https://github.com/inngest/inngest-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pylint.'MESSAGES CONTROL']
disable = [
    'broad-exception-caught',
    'broad-exception-raised',
    'duplicate-code',
    'fixme',
    'invalid-envvar-value',
    'line-too-long',
    'missing-docstring',
    'too-few-public-methods',
    'too-many-arguments',
    'too-many-instance-attributes',
    'too-many-return-statements',
    'unused-argument',
]

[tool.pytest.ini_options]
filterwarnings = ['ignore::pytest.PytestAssertRewriteWarning']

[tool.setuptools.package-data]
# Makes py.typed appear when users install the inngest package.
inngest_langchain = ["py.typed"]
